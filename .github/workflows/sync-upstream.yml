name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          TARGET_BRANCH: ${{ github.ref_name }}
          UPSTREAM_URL: https://github.com/DietrichGebert/ponytail
          UPSTREAM_BRANCH: main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --strategy=ours --no-commit --no-ff "$UPSTREAM_URL" "$UPSTREAM_BRANCH"
          git rm -r --ignore-unmatch -- skills ':(top,glob)LICENSE*'
          git restore --source=FETCH_HEAD --staged --worktree -- skills ':(top,glob)LICENSE*'
          git rm -r --ignore-unmatch -- . ':(exclude)skills' ':(exclude).github/workflows' ':(top,exclude,glob)LICENSE*'
          test -d skills && test -d .github/workflows
          for license in LICENSE*; do test -f "$license"; done
          test -z "$(find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name skills ! -name 'LICENSE*' -print -quit)"
          test -z "$(find .github -mindepth 1 -maxdepth 1 ! -name workflows -print -quit)"
          if git rev-parse --verify --quiet MERGE_HEAD >/dev/null || ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream skills"
            git push origin "HEAD:$TARGET_BRANCH"
          fi