name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: actions/checkout@v4 - Check Out Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: bash - Merge Upstream and Retain Approved Paths
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          UPSTREAM_URL: https://github.com/DietrichGebert/ponytail
          UPSTREAM_BRANCH: main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch "$UPSTREAM_URL" "$UPSTREAM_BRANCH"
          if ! git merge --no-commit --no-ff FETCH_HEAD; then
            test "$(git ls-files --unmerged)" != ""
            git diff --name-only --diff-filter=U -z |
              git --literal-pathspecs restore --source=FETCH_HEAD --staged --worktree \
                --pathspec-from-file=- --pathspec-file-nul
          fi
          git restore --source=HEAD --staged --worktree -- .github/workflows
          # Ponytail skills do not need repository build or benchmark tooling.
          retained=(
            LICENSE
            .github/workflows/
            skills/
          )
          excluded=(':(top,glob,exclude)LICENSE*')
          for file in "${retained[@]}"; do
            excluded+=(":(top,exclude,literal)$file")
          done
          git rm -r --force --ignore-unmatch -- . "${excluded[@]}"

          test -d skills && test -d .github/workflows
          for license in LICENSE*; do test -f "$license"; done
          test "$(git ls-files -- . "${excluded[@]}")" = ""
          if git rev-parse --verify --quiet MERGE_HEAD >/dev/null || ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream skills"
            git push origin "HEAD:$TARGET_BRANCH"
          fi